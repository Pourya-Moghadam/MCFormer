[build-system]
requires = ["setuptools==75.3.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-former"
version = "0.1.0"
description = "Reproducible research infrastructure for MC-Former"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
  {name = "Pourya Moghadam"},
  {name = "Atena Roshan Fekr"},
]
keywords = ["action recognition", "video transformers", "pytorch", "reproducibility"]
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "numpy==1.26.4",
  "PyYAML==6.0.2",
  "torch==2.4.1",
  "torchvision==0.19.1",
]

[project.optional-dependencies]
dev = [
  "build==1.2.2.post1",
  "mypy==1.13.0",
  "pytest==8.3.3",
  "pytest-cov==5.0.0",
  "ruff==0.7.1",
]
preprocessing = [
  "opencv-python-headless==4.10.0.84",
  "ultralytics==8.3.23",
]
analysis = [
  "matplotlib==3.9.2",
  "pandas==3.0.5",
  "scikit-learn==1.5.2",
]
pose = [
  "mmcv==2.1.0",
  "mmengine==0.10.5",
  "mmpose==1.3.2",
  "opencv-python-headless==4.10.0.84",
]

[project.scripts]
mcformer-show-config = "mcformer.cli.show_config:main"
mcformer-init-run = "mcformer.cli.init_run:main"
mcformer-prepare-manifest = "mcformer.cli.prepare_manifest:main"
mcformer-prepare-protocol = "mcformer.cli.prepare_protocol:main"
mcformer-preprocess = "mcformer.cli.preprocess:main"
mcformer-validate-data = "mcformer.cli.validate_data:main"
mcformer-train = "mcformer.cli.train:main"
mcformer-evaluate = "mcformer.cli.evaluate:main"
mcformer-analyze = "mcformer.cli.analyze:main"
mcformer-corrupt-cache = "mcformer.cli.corrupt_cache:main"
mcformer-aggregate-sweep = "mcformer.cli.aggregate_sweep:main"
mcformer-show-sweep = "mcformer.cli.show_sweep:main"
mcformer-benchmark-inference = "mcformer.cli.benchmark_inference:main"
mcformer-aggregate-cost = "mcformer.cli.aggregate_cost:main"
mcformer-extract-features = "mcformer.cli.extract_features:main"
mcformer-project-tsne = "mcformer.cli.project_tsne:main"
mcformer-visualize-interaction = "mcformer.cli.visualize_interaction:main"
mcformer-profile-training = "mcformer.cli.profile_training:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unreachable = true
packages = ["mcformer"]
