name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip
      - name: Install CPU PyTorch
        run: >-
          python -m pip install
          torch==2.4.1 torchvision==0.19.1
          --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,analysis]' --no-deps
          python -m pip install \
            numpy==1.26.4 PyYAML==6.0.2 \
            build==1.2.2.post1 mypy==1.13.0 pytest==8.3.3 pytest-cov==5.0.0 ruff==0.7.1 \
            matplotlib==3.9.2 pandas==2.2.3 scikit-learn==1.5.2
      - name: Verify source and package
        run: make check
